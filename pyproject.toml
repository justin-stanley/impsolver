[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "impsolver"
version = "0.1.0"
description = "Neutral vote math for U.S. impeachment (House) and conviction (Senate)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Stanley" }]
requires-python = ">=3.12"
keywords = ["congress", "impeachment", "voting", "simulation", "political-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Sociology",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "pydantic>=2.6", "ruamel.yaml>=0.18", "pulp[cbc]>=2.9,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6.9", "mypy>=1.11", "pre-commit>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/justin-stanley/impsolver"
Documentation = "https://justin-stanley.github.io/impsolver/"
Source = "https://github.com/justin-stanley/impsolver"
Issues = "https://github.com/justin-stanley/impsolver/issues"
Changelog = "https://github.com/justin-stanley/impsolver/blob/main/CHANGELOG.md"

[project.scripts]
impsolver = "impsolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
impsolver = ["py.typed", "data/rules/*.yaml", "data/fixtures/*.yaml", "data/fixtures/members/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.coverage.run]
source = ["impsolver"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
