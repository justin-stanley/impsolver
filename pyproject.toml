[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impsolver"
version = "0.1.0"
description = "Neutral vote-math solver for impeachment (House) and conviction (Senate)"
requires-python = ">=3.12"
dependencies = ["numpy", "pydantic>=2.6", "ruamel.yaml>=0.18", "pulp<3"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[project.scripts]
impsolver = "impsolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
