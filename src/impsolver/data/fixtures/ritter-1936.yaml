# sec. 18, citing 80 Cong. Rec. 3091 and 5606-07. Senate not_voting is derived, not recorded: it
# assumes 96 senators seated, as the senate.gov party-division table shows for the 2nd session of
# the 74th Congress. It affects only the quorum check.
