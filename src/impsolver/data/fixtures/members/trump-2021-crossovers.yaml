# Republicans who voted to impeach (House, 2021-01-13) or convict (Senate, 2021-02-13) in the
# second Trump impeachment. Ids are bioguide ids. Members with id null were not seated in the
# 116th Congress, so they have no history in the calibration window.
#
# not_voting lists the Republicans of the 116th Congress who cast no vote on the event: members
# who had left before the 117th Congress, non-voting delegates, and members recorded Not Voting.
# Scoring leaves them out rather than counting them as non-crossers.
# House: every 116th Congress Republican not recorded Yea or Nay on roll call 17, 117th Congress
#   (H.Res. 24, 2021-01-13; Republicans 10 yea, 197 nay, 4 not voting):
#   https://clerk.house.gov/Votes/202117 (XML: https://clerk.house.gov/evs/2021/roll017.xml),
#   matched by bioguide id.
# Senate: every 116th Congress Republican absent from the roll of Senate vote 59, 117th Congress,
#   1st session (2021-02-13, guilty 57, not guilty 43; all 100 senators voted):
#   https://www.senate.gov/legislative/LIS/roll_call_votes/vote1171/vote_117_1_00059.htm
