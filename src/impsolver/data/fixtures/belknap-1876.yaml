# Senate trial of William W. Belknap, former Secretary of War (he resigned before the House
# vote). Acquitted on all five articles, each five votes short; most "not guilty" votes were cast
# on the ground that the Senate lacked jurisdiction over a former officer. Tallies are from
# Hinds' Precedents vol. 3 sec. 2467, citing Senate Journal pp. 992-1012; the managers' report
# there says "a change of 5 votes" would have convicted. not_voting is derived, not recorded: it
# assumes 73 of 74 seats filled, as the senate.gov party-division table shows for the 1st session
# of the 44th Congress (Colorado's senators were not seated until December 1876). It affects only
# the quorum check.
