# Senate trial of Judge Harry E. Claiborne (D. Nev.). Convicted on articles I, II and IV. Article
# III got 46 guilty, 17 not guilty and 35 "present": two-thirds of the 98 senators present is 66,
# so it failed. No separate removal or disqualification vote. Tallies are from the senate.gov case
# page (LIS roll-call pages start in 1989). not_voting is derived, not recorded: it assumes all 100
# seats were filled, as the senate.gov party-division table shows for the 2nd session of the 99th
# Congress. It affects only the quorum check.
