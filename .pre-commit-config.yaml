# Install once with `pre-commit install`; CI runs the same checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(examples/portfolio-example\.html|schemas/)
      - id: trailing-whitespace
        exclude: ^(examples/portfolio-example\.html|schemas/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        files: ^src/
        additional_dependencies: ["pydantic>=2.6", "numpy>=1.26", "ruamel.yaml>=0.18", "pulp[cbc]>=2.9,<5"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse-lint-file
