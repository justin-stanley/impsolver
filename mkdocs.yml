site_name: impsolver
site_description: Counts the votes needed to impeach and remove a U.S. official, and estimates the odds of getting them.
site_url: https://justin-stanley.github.io/impsolver/
repo_url: https://github.com/justin-stanley/impsolver
repo_name: justin-stanley/impsolver
edit_uri: edit/main/docs/
copyright: Code MIT, Justin Stanley. Data derived from Voteview; see Data sources.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google

exclude_docs: |
  examples/run_examples.py
  examples/generated/
  maintainers/

not_in_nav: |
  demo/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Methodology:
      - Rules and gates: methodology/gates.md
      - Probability model: methodology/model.md
      - Portfolio scheduling: methodology/portfolio.md
      - Validation and limits: methodology/validation.md
  - Worked examples:
      - Replaying history: examples/history.md
      - One hypothetical case: examples/single-case.md
      - Several cases at once: examples/portfolio.md
      - Changing assumptions: examples/assumptions.md
  - Reference:
      - CLI: reference/cli.md
      - File formats: reference/file-formats.md
      - Python API: reference/api.md
      - Functional spec: functional-spec.md
      - Technical design: technical-design.md
      - Design reference: design-reference.md
  - Project:
      - Responsible use: responsible-use.md
      - Data sources: data.md
      - Contributing: contributing.md
      - Changelog: changelog.md
  - Demo planning page: demo/index.html
