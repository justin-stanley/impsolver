version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # PuLP 3+ changed its API; impsolver pins pulp<3 until the ILP code is ported.
      - dependency-name: pulp
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
