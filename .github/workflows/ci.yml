name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"  # tests read and write fixture text without naming an encoding
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - name: Tests with coverage (floor in pyproject.toml)
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml
      - name: Backtest
        run: uv run impsolver backtest
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  minimum-versions:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - name: Install the lowest versions allowed by pyproject.toml
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e '.[dev]'
      # JSON schema output varies between pydantic versions, so the drift test runs only on the lock.
      - run: uv run --no-sync pytest -q -p no:cacheprovider --deselect tests/test_schemas.py
      - run: uv run --no-sync impsolver backtest

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel outside the source tree and run it
        run: |
          cd "$RUNNER_TEMP"
          uv venv wheel-env
          uv pip install --python wheel-env "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/impsolver backtest
          wheel-env/bin/impsolver validate us-federal

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
